# ConfiguraciÃ³n centralizada del proyecto.
#
# ReÃºne en un solo sitio lo que antes estaba disperso: pytest.ini, las flags de
# ruff sueltas en CI, pyrightconfig.json y requirements.txt. Misma configuraciÃ³n
# que antes; ahora vive en un lugar y tiene una sola fuente de verdad.

[project]
name = "Magisys"
version = "5.28.0"
description = "Entorno de desarrollo con un enjambre de tres inteligencias que debaten antes de actuar."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `--timeout` global: ningÃºn test puede colgar la suite. 120 s es holgado para
# todo lo que no compila (el 99%); los que compilan un .exe llevan su propia
# marca con 300. Sin esto, un cuelgue no falla: bloquea, que es peor porque no
# deja diagnÃ³stico.
addopts = "-q --no-header --timeout=120"
markers = [
    "slow: tests that compile or run heavy artifacts (e.g. PyInstaller builds)",
    # `timeout` ya NO se declara aquÃ­: la registra `pytest-timeout`, que ahora
    # sÃ­ estÃ¡ instalado. Declararla a mano era justo lo que ocultaba el
    # problema â€” pytest no avisaba de marca desconocida y todo el mundo daba
    # por hecho que el plazo se aplicaba. No se aplicaba.
    # Ver tests/conftest.py: el test que la lleva toca la frontera con el
    # exterior a propÃ³sito (red, disco, navegador). A cambio no puede afirmar
    # nada que dependa de lo que haya instalado, porque en el CI hay otra cosa.
    "frontera: el test cruza la frontera con el exterior a propÃ³sito",
    # Ver tests/conftest.py: por defecto los tests ven un catÃ¡logo de
    # proveedores CONGELADO. Esta marca pide el de verdad, y solo la necesitan
    # los tests que comprueban el catÃ¡logo en sÃ­ (que el JSON coincida con las
    # constantes, que toda familia verificada tenga candidatos).
    "catalogo_real: el test lee el catÃ¡logo de proveedores de verdad",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # curl_cffi (interno de g4f) registra un selector thread porque el
    # ProactorEventLoop de Windows no implementa add_reader. Es inofensivo
    # (es cÃ³mo curl_cffi funciona bajo Proactor) pero ensucia la salida de
    # tests. No podemos cambiar de policy: el SelectorEventLoop no soporta
    # asyncio.subprocess en Windows, que el proyecto sÃ­ usa (Naoko, run_tests).
    #
    # Dos detalles, y sin cualquiera de los dos el filtro no filtra nada:
    #
    # 1. NO se nombra la clase curl_cffi.utils.CurlCffiWarning. Nombrarla obliga
    #    a pytest a importar curl_cffi al leer la configuraciÃ³n, y donde no estÃ¡
    #    instalado â€”el runner de Linux del CI, un clon reciÃ©n hechoâ€” eso emite
    #    Â«PytestConfigWarning: Failed to import filter moduleÂ»: el filtro puesto
    #    para quitar un aviso creaba otro en la mitad de las mÃ¡quinas.
    #
    # 2. El `(?s).*` del principio NO es adorno. El campo de mensaje es una
    #    expresiÃ³n regular ANCLADA AL INICIO (re.match), y el mensaje real de
    #    curl_cffi empieza con un salto de lÃ­nea y cuatro espacios:
    #
    #        CurlCffiWarning: \n    Proactor event loop does not implement...
    #
    #    Un patrÃ³n que empiece por Â«ProactorÂ» no casa nunca, y el filtro parece
    #    puesto sin estarlo. Es el fallo mÃ¡s silencioso de esta clase: la
    #    configuraciÃ³n es vÃ¡lida, pytest no protesta, y el aviso sigue saliendo.
    "ignore:(?s).*Proactor event loop does not implement add_reader",
    # Naoko lanza un _watch_loop en su constructor. Aunque el test lo cancela,
    # el recolector de Python puede emitir ResourceWarning sobre transports
    # que ya estÃ¡n cerrÃ¡ndose. CosmÃ©tico.
    "ignore:unclosed transport:ResourceWarning",
]

# --- ruff ---------------------------------------------------------------
# line-length = 100 sigue la convenciÃ³n REAL del cÃ³digo (p99 = 100, solo el 1%
# de las lÃ­neas la supera). Forzar 88 habrÃ­a reformateado medio repositorio.
[tool.ruff]
line-length = 100
extend-exclude = [
    "magi/_attic",      # andamiaje retirado: se conserva como mapa, no se mantiene
    "magi-gui",         # frontend TypeScript/Tauri, no es cÃ³digo Python
    "build",
    "dist",
]

[tool.ruff.lint]
# Set inicial deliberadamente CONSERVADOR: errores y warnings que indican
# bugs reales o problemas de mantenimiento, no estilo opinable. Se amplÃ­a
# progresivamente a medida que la deuda existente se salda.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/vars, undefined names...)
    "W",    # pycodestyle warnings
    "I",    # isort (orden de imports)
    "UP",   # pyupgrade (sintaxis moderna)
    "B",    # flake8-bugbear (bugs comunes probables)
]
# E501 queda fuera hasta saldar la deuda: 268 lineas pasan de 100 y tocarlas
# a mano hoy es ruido sin beneficio. El resto de las reglas SI bloquea: la
# deuda pendiente tras la limpieza del 2026-08-16 es cero en errores reales
# (F, E722, E741, B...) y debe seguir siendolo.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests pueden tener imports sin uso (fixtures) y nombres ambigÃ¼os.
"tests/**/*.py" = ["F401", "F841"]

# main.py configura la consola ANTES de importar webview y la GUI: si no, el
# primer print en cp1252 tira toda la consola en Windows. Los imports por
# debajo de esa llamada son deliberados.
"magi/main.py" = ["E402"]

# NOTA: la config de pyright sigue en pyrightconfig.json. pyright no estÃ¡ en
# requirements (es opcional, para desarrollo) y no podemos verificar localmente
# si lee [tool.pyright] desde aquÃ­, asÃ­ que no se duplica.
