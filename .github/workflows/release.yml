name: Build and Release Magisys

# LA COMPUERTA (v5.28.0): este workflow es la ÚNICA vía de publicación, y
# prueba EXACTAMENTE lo que publica:
#
#   1. El job `test` (ubuntu, requirements.txt) comprueba que el proyecto
#      sigue vivo con las versiones de HOY — donde quieres enterarte de que
#      un upstream rompió algo.
#   2. El job `build` (windows) instala requirements.lock, corre la suite
#      rápida SOBRE ESE LOCK, compila el .exe con él y EJECUTA el .exe
#      (`--selftest`) antes de publicar. La suite que aprueba el binario es
#      la del binario: mismo intérprete, mismas dependencias, misma
#      plataforma. Hasta v5.27.1 el gate corría en ubuntu, donde los tests
#      que compilan un .exe se saltan solos: verde sin probar lo publicado.
#   3. tag == versión de pyproject.toml, bloqueante. Una versión, una
#      fuente de verdad (v5.27.0 en pyproject vs tag v5.27.1 no puede
#      volver a pasar desapercibida).
#
# Este contrato lo vigila tests/test_la_compuerta.py: si alguien debilita la
# receta (un `if:` que salte el selftest, un paso no bloqueante, quitar la
# suite del lock), el CI se pone en rojo.
#
# La vía local (antes scripts/publicar.py) queda como rescate de emergencia
# documentado: scripts/rescate_release.py. DOS RECETAS NO: una receta y un
# rescate con su nombre puesto.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a publicar (debe existir como tag git)'
        required: true
        default: 'v5.28.0'

permissions:
  contents: write

# Un release por tag: jamás se cancela un release en curso.
concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: El tag y pyproject dicen la misma versión (bloqueante)
      run: |
        v=$(python3 -c 'import re; print(re.search(r"^version\s*=\s*\"([^\"]+)\"", open("pyproject.toml", encoding="utf-8").read(), re.M).group(1))')
        if [ "v$v" != "${RELEASE_TAG}" ]; then
          echo "::error::tag ${RELEASE_TAG} != v$v de pyproject.toml — una versión, una fuente de verdad"
          exit 1
        fi
        echo "VERSION=$v" >> "$GITHUB_ENV"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # De requirements.txt, nunca a mano: ver la nota en ci.yml. Enumerar aquí
    # es lo que dejó este job sin `websockets` y sin `numpy`, y este job
    # es el que decide si hay .exe.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Run test suite
      run: python -m pytest tests/ -v

    - name: Verify no absolute machine paths
      # Con comillas simples el patrón llega intacto a grep (ver la historia
      # en el propio fichero: entre comillas dobles, `\|` era un pipe LITERAL
      # y el paso estaba siempre en verde sin comprobar nada).
      run: |
        if grep -rnE '[A-Za-z]:[\\/](PROYECTOS|Users|Games Only)' \
             --include='*.py' --include='*.json' --include='*.toml' \
             --include='*.yml' --include='*.yaml' \
             --exclude=paths.py --exclude=naoko_repair.py \
             magi/ pyrightconfig.json pyproject.toml; then
          echo "Ruta absoluta detectada: el .exe no arrancaria en otra maquina"
          exit 1
        fi

  build:
    runs-on: windows-latest
    needs: test          # sin tests verdes no hay release
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
    - name: Checkout repository (en el tag a publicar)
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: El tag y pyproject dicen la misma versión (bloqueante)
      run: |
        $v = (python -c 'import re; print(re.search(r"^version\s*=\s*\"([^\"]+)\"", open("pyproject.toml", encoding="utf-8").read(), re.M).group(1))')
        if ("v$v" -ne "$env:RELEASE_TAG") {
          Write-Host "::error::tag $env:RELEASE_TAG != v$v de pyproject.toml"
          exit 1
        }
        "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # Node 22 y `npm ci`, EXACTAMENTE igual que el job `gui` de ci.yml. Vite 7
    # exige `^20.19.0 || >=22.12.0`, y `npm install` ignora el lock.
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: magi-gui/package-lock.json

    # DEL LOCK: este job compila el binario que se PUBLICA. Aquí no se quiere
    # la última versión: se quiere exactamente la que se probó. Ver la
    # cabecera del workflow: hasta v5.27.1, el gate probaba OTRAS versiones
    # en OTRA plataforma.
    - name: Install Python dependencies (bloqueadas)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install pyinstaller pywebview

    # ffmpeg ANTES de la suite: en Windows, sin ffmpeg los tests de vídeo no
    # se saltan — FALLAN, porque comprueban el mensaje de "no existe el punto
    # de entrada" y recibían "ffmpeg no está instalado" (ver ci.yml).
    - name: Install ffmpeg
      run: choco install ffmpeg -y --no-progress

    # LA COMPUERTA: la suite rápida corre en ESTE job, en Windows, sobre el
    # lock con el que se compilará el .exe. Sin este verde no hay binario.
    - name: Run test suite (desde el lock, en Windows)
      run: python -m pytest tests/ -q --tb=short -m "not slow"

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm ci
        npm run build

    # SE COMPILA CON EL .spec, NO CON LA LÍNEA DE COMANDO: una sola receta.
    # (La historia completa de por qué, en el historial del fichero.)
    - name: Build Executable (PyInstaller, desde el .spec)
      run: pyinstaller --clean --noconfirm Magisys.spec

    - name: Verificar que lo que hace falta viajó dentro
      # Las tres cosas que un .exe puede perder SIN dar error al arrancar,
      # que es lo que las hace peligrosas: se publicaría un binario que
      # parece bueno y hace la mitad.
      run: |
        if (-not (Test-Path "magi/data/catalogo_proveedores.json")) {
          throw "falta magi/data/catalogo_proveedores.json en el repo"
        }
        if (-not (Test-Path "assets/python-embed/extracted/python.exe")) {
          throw "falta el Python embebido (assets/python-embed/extracted): el .exe no podria ejecutar nada"
        }
        if (-not (Test-Path "dist/Magisys.exe")) {
          throw "PyInstaller no produjo el .exe"
        }
        $toc = "build/Magisys/Analysis-00.toc"
        if (-not (Test-Path $toc)) { throw "no encuentro el inventario $toc" }
        if (-not (Select-String -Path $toc -Pattern "python-embed" -Quiet)) {
          throw "el Python embebido NO entro en el binario"
        }
        Write-Host "python embebido: dentro del binario (verificado en el inventario)"

        $mb = [math]::Round((Get-Item "dist/Magisys.exe").Length / 1MB, 1)
        Write-Host "exe: $mb MB"
        if ($mb -lt 100) { throw "el .exe pesa $mb MB: se quedo algo fuera" }

    # EL SMOKE TEST REAL (v5.28.0): el binario se EJECUTA antes de publicarse.
    # Arranca sin ventana, valida núcleo, catálogo, ambos registros y —solo
    # posible aquí, en el binario— que el Python EMBEBIDO corre un
    # subproceso de verdad. «El exe pesa lo que debe» no implica «el exe
    # arranca»; esto sí lo prueba.
    - name: Smoke test del binario (--selftest)
      # El exe es windowed: pwsh no espera a un proceso GUI ni captura su
      # stdout (corrió «verde» sin ejecutar nada). Start-Process -Wait espera
      # de verdad; el selftest deja su informe en dist/, se vuelca al log y
      # se exige SELFTEST OK con código 0: sin binario arrancado no hay release.
      run: |
        $p = Start-Process -FilePath "dist/Magisys.exe" -ArgumentList "--selftest" -Wait -PassThru
        if (Test-Path "dist/selftest_report.txt") { Get-Content "dist/selftest_report.txt" }
        if ($p.ExitCode -ne 0) { throw "el selftest salio con codigo $($p.ExitCode)" }
        if (-not (Select-String -Path "dist/selftest_report.txt" -Pattern "SELFTEST OK" -Quiet)) { throw "sin SELFTEST OK en el informe: no se publica" }
      shell: pwsh

    - name: Zip Release (versionado)
      # Un .zip con LA VERSIÓN en el nombre: hasta v5.27.1 el asset se llamaba
      # igual en cada release (MAGI-IDE-v5.zip) y no distinguía nada.
      run: |
        $z = "dist/Magisys-v$env:VERSION-win64.zip"
        # NINGUNA clave dentro del zip (decisión del dueño, 2026-09-28): el
        # subagente Groq se activa con la variable de entorno GROQ_API_KEY
        # de cada máquina. Sin ella, el enjambre cae a g4f y el selftest lo
        # declara en su informe.
        Compress-Archive -Path "dist/Magisys.exe" -DestinationPath $z -Force
        $mb = [math]::Round((Get-Item $z).Length / 1MB, 1)
        Write-Host "zip: $mb MB -> $z"

    - name: Checksums SHA256
      run: |
        $z = "dist/Magisys-v$env:VERSION-win64.zip"
        $h1 = (Get-FileHash $z -Algorithm SHA256).Hash
        $h2 = (Get-FileHash "dist/Magisys.exe" -Algorithm SHA256).Hash
        "$($h1.ToLower())  Magisys-v$env:VERSION-win64.zip" | Out-File dist/CHECKSUMS.txt -Encoding ascii
        "$($h2.ToLower())  Magisys.exe"  | Out-File dist/CHECKSUMS.txt -Encoding ascii -Append
        Get-Content dist/CHECKSUMS.txt

    - name: Notas de ESTA versión
      # Solo la sección del tag, no el RELEASE_NOTES.md entero (48 KB en cada
      # release: nadie puede distinguir qué cambió en esta). Si el tag no
      # tiene sección, se nota y se usa el autogenerado — nunca mentir.
      run: |
        python -c "import sys; from pathlib import Path; import re
        notas = Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
        tag = '$env:RELEASE_TAG'
        m = re.search(rf'(?ms)^# {re.escape(tag)}\b.*?(?=^\# |\Z)', notas)
        if m:
            Path('dist/NOTAS.md').write_text(m.group(0).strip() + '\n', encoding='utf-8')
            print('notas extraidas para', tag)
        else:
            Path('dist/NOTAS.md').write_text(f'({tag} sin seccion en RELEASE_NOTES.md — ver commits)\n', encoding='utf-8')
            print('AVISO: sin seccion para', tag)"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "Magisys ${{ env.RELEASE_TAG }}"
        files: |
          dist/Magisys-v${{ env.VERSION }}-win64.zip
          dist/CHECKSUMS.txt
        body_path: dist/NOTAS.md
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
